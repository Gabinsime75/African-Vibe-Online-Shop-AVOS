plugins {
    id 'com.google.protobuf' version '0.9.6'
    id 'com.github.sherter.google-java-format' version '0.9'
    id 'idea'
    id 'application'
}

repositories {
    mavenCentral()
    mavenLocal()
}

description = 'AVOS contextual advertisement service'
group = "com.africanvibe.avos"
version = "1.0.0"

def grpcVersion = "1.78.0"
def jacksonCoreVersion = "2.21.0"
def jacksonDatabindVersion = "2.21.0"
def protocVersion = "4.36.2"

tasks.withType(JavaCompile).configureEach {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    options.encoding = 'UTF-8'
}

ext {
    speed = project.hasProperty('speed') ? project.getProperty('speed') : false
    offlineCompile = new File("$buildDir/output/lib")
}

dependencies {
    implementation platform("io.netty:netty-bom:4.1.137.Final")
    implementation platform("io.opentelemetry:opentelemetry-bom:1.67.0")
    if (speed) {
        implementation fileTree(dir: offlineCompile, include: '*.jar')
    } else {
        implementation "com.google.api.grpc:proto-google-common-protos:2.64.1",
                "javax.annotation:javax.annotation-api:1.3.2",
                "io.grpc:grpc-protobuf:${grpcVersion}",
                "io.grpc:grpc-stub:${grpcVersion}",
                "io.grpc:grpc-netty:${grpcVersion}",
                "io.grpc:grpc-services:${grpcVersion}",
                "io.grpc:grpc-census:${grpcVersion}",
                "io.opentelemetry:opentelemetry-sdk-extension-autoconfigure",
                "io.opentelemetry:opentelemetry-exporter-otlp",
                "io.opentelemetry.instrumentation:opentelemetry-grpc-1.6:2.33.0-alpha",
                "org.apache.logging.log4j:log4j-core:2.25.3",
                "com.google.protobuf:protobuf-java:${protocVersion}"

        runtimeOnly "com.fasterxml.jackson.core:jackson-core:${jacksonCoreVersion}",
                "com.fasterxml.jackson.core:jackson-databind:${jacksonDatabindVersion}",
                "io.netty:netty-tcnative-boringssl-static:2.0.74.Final"
    }
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protocVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
        ofSourceSet('main')
    }
}

googleJavaFormat {
    toolVersion '1.33.0'
}

// Inform IDEs like IntelliJ IDEA, Eclipse or NetBeans about the generated code.
sourceSets {
    main {
        java {
            srcDirs 'hipstershop'
            srcDirs 'build/generated/source/proto/main/java/hipstershop'
            srcDirs 'build/generated/source/proto/main/grpc/hipstershop'
        }
    }
}

application {
    mainClass.set('hipstershop.AdService')
    applicationName = 'avos-adservice'
}

// This to cache dependencies during Docker image building. First build will take time.
// Subsequent build will be incremental.
task downloadRepos(type: Copy) {
    from configurations.compileClasspath
    into offlineCompile
    from configurations.compileClasspath
    into offlineCompile
}

// AVOS CI behavioral tests.
dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'io.opentelemetry:opentelemetry-sdk-testing'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

tasks.register('verifyAdTests') {
    dependsOn tasks.named('test')

    doLast {
        def reports = fileTree("$buildDir/test-results/test") {
            include 'TEST-*.xml'
        }

        if (reports.isEmpty()) {
            throw new GradleException('No Java test reports were generated.')
        }

        long passed = 0
        reports.each { report ->
            def suite = new XmlSlurper().parse(report)
            passed += suite.@tests.toLong() -
                suite.@failures.toLong() -
                suite.@errors.toLong() -
                suite.@skipped.toLong()
        }

        if (passed == 0) {
            throw new GradleException('No Java tests passed.')
        }

        logger.lifecycle("AVOS Java tests passed: ${passed}")
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyAdTests')
}

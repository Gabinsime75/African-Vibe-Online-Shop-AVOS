{{ define "error" }}
    {{ template "header" . }}
    <main role="main">
        <div class="py-5">
            <div class="container bg-light py-3 px-lg-5 py-lg-5">
                <h1>AVOS could not complete this request</h1>
                <p>Please check your request and try again.</p>

                <p><strong>HTTP Status:</strong> {{.status_code}} {{.status}}</p>
                {{ if $.request_id }}<p>Support reference: {{ $.request_id }}</p>{{ end }}
                <a class="avos-button-primary" href="{{ $.baseUrl }}/">Return to AVOS</a>
            </div>
        </div>
    </main>

    {{ template "footer" . }}
    {{ end }}

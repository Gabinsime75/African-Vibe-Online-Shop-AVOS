# =============================================================================
# CloudHustler Commerce Platform
# Loki Alerting Rules
#
# Purpose:
# Defines Prometheus alerts for Loki availability, ingestion health,
# discarded logs, request failures, latency, and persistent storage.
#
# These rules are evaluated by Prometheus and forwarded to Alertmanager.
# =============================================================================

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: cloudhusller-loki-alerts
  namespace: monitoring

  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/name: platform-alerting
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: cloudhusller-commerce-platform
    app.kubernetes.io/managed-by: terraform
    environment: dev

spec:
  groups:

    # -------------------------------------------------------------------------
    # Loki Availability
    # -------------------------------------------------------------------------

    - name: loki.availability

      rules:

        - alert: LokiTargetDown

          expr: |
            max(
              up{
                namespace="logging",
                job=~".*loki.*"
              }
            ) == 0

          for: 5m

          labels:
            severity: critical
            service: loki
            category: availability

          annotations:
            summary: Loki is unavailable.
            description: >
              Prometheus has been unable to scrape the Loki target
              for more than five minutes.

        - alert: LokiPodUnavailable

          expr: |
            kube_statefulset_status_replicas_ready{
              namespace="logging",
              statefulset="loki"
            }
            <
            kube_statefulset_replicas{
              namespace="logging",
              statefulset="loki"
            }

          for: 5m

          labels:
            severity: critical
            service: loki
            category: availability

          annotations:
            summary: Loki StatefulSet is unavailable.
            description: >
              The Loki StatefulSet has fewer ready replicas than desired.

    # -------------------------------------------------------------------------
    # Loki Ingestion
    # -------------------------------------------------------------------------

    - name: loki.ingestion

      rules:

        - alert: LokiLogIngestionStopped

          expr: |
            sum(
              rate(
                loki_distributor_lines_received_total[5m]
              )
            ) == 0

          for: 10m

          labels:
            severity: warning
            service: loki
            category: ingestion

          annotations:
            summary: Loki log ingestion has stopped.
            description: >
              Loki has not received any log lines for at least ten minutes.
              Verify Fluent Bit and Loki connectivity.

        - alert: LokiDiscardingLogs

          expr: |
            sum by(reason)(
              rate(
                loki_discarded_samples_total[5m]
              )
            ) > 1

          for: 5m

          labels:
            severity: warning
            service: loki
            category: ingestion

          annotations:
            summary: Loki is discarding log entries.
            description: >
              Loki is discarding more than one log entry per second.
              Reason: {{ $labels.reason }}.

    # -------------------------------------------------------------------------
    # Loki Requests
    # -------------------------------------------------------------------------

    - name: loki.requests

      rules:

        - alert: LokiRequestErrors

          expr: |
            sum(
              rate(
                loki_request_duration_seconds_count{
                  status_code=~"5.."
                }[5m]
              )
            ) > 0

          for: 5m

          labels:
            severity: warning
            service: loki
            category: requests

          annotations:
            summary: Loki request failures detected.
            description: >
              Loki is returning HTTP 5xx responses.

        - alert: LokiHighRequestLatency

          expr: |
            histogram_quantile(
              0.95,
              sum by(le)(
                rate(
                  loki_request_duration_seconds_bucket[5m]
                )
              )
            ) > 2

          for: 10m

          labels:
            severity: warning
            service: loki
            category: performance

          annotations:
            summary: Loki request latency is high.
            description: >
              Loki P95 request latency has exceeded two seconds
              for at least ten minutes.

    # -------------------------------------------------------------------------
    # Loki Storage
    # -------------------------------------------------------------------------

    - name: loki.storage

      rules:

        - alert: LokiPersistentVolumeAlmostFull

          expr: |
            (
              1 -
              (
                kubelet_volume_stats_available_bytes{
                  namespace="logging",
                  persistentvolumeclaim=~"storage-loki-.*"
                }
                /
                kubelet_volume_stats_capacity_bytes{
                  namespace="logging",
                  persistentvolumeclaim=~"storage-loki-.*"
                }
              )
            ) * 100 > 80

          for: 10m

          labels:
            severity: warning
            service: loki
            category: storage

          annotations:
            summary: Loki persistent volume is nearing capacity.
            description: >
              Loki PVC {{ $labels.persistentvolumeclaim }}
              has exceeded 80 percent utilization.

        - alert: LokiPersistentVolumeCritical

          expr: |
            (
              1 -
              (
                kubelet_volume_stats_available_bytes{
                  namespace="logging",
                  persistentvolumeclaim=~"storage-loki-.*"
                }
                /
                kubelet_volume_stats_capacity_bytes{
                  namespace="logging",
                  persistentvolumeclaim=~"storage-loki-.*"
                }
              )
            ) * 100 > 90

          for: 5m

          labels:
            severity: critical
            service: loki
            category: storage

          annotations:
            summary: Loki persistent volume is almost full.
            description: >
              Loki PVC {{ $labels.persistentvolumeclaim }}
              has exceeded 90 percent utilization.
# =============================================================================
# CloudHustler Commerce Platform
# Kubernetes Alerting Rules
#
# Purpose:
# Monitors Kubernetes node health, resource utilization, pod stability,
# persistent storage, Deployments, StatefulSets, and DaemonSets.
#
# These rules are evaluated by Prometheus and forwarded to Alertmanager.
# =============================================================================

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: cloudhusller-kubernetes-alerts
  namespace: monitoring

  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/name: platform-alerting
    app.kubernetes.io/component: kubernetes
    app.kubernetes.io/part-of: cloudhusller-commerce-platform
    app.kubernetes.io/managed-by: terraform
    environment: dev

spec:
  groups:

    # -------------------------------------------------------------------------
    # Kubernetes Platform Alerts
    # -------------------------------------------------------------------------

    - name: kubernetes.platform

      rules:

        # ---------------------------------------------------------------------
        # Node Not Ready
        # ---------------------------------------------------------------------

        - alert: KubernetesNodeNotReady

          expr: |
            kube_node_status_condition{
              condition="Ready",
              status="true"
            } == 0

          for: 5m

          labels:
            severity: critical
            service: kubernetes
            category: availability

          annotations:
            summary: Kubernetes node is not Ready.
            description: >
              Node {{ $labels.node }} has been in the NotReady state
              for longer than five minutes.

        # ---------------------------------------------------------------------
        # High CPU
        # ---------------------------------------------------------------------

        - alert: KubernetesNodeHighCPU

          expr: |
            (
              100 -
              (
                avg by(instance)(
                  rate(
                    node_cpu_seconds_total{
                      mode="idle"
                    }[5m]
                  )
                ) * 100
              )
            ) > 80

          for: 10m

          labels:
            severity: warning
            service: kubernetes
            category: resources

          annotations:
            summary: High node CPU utilization.
            description: >
              Node {{ $labels.instance }}
              CPU utilization has exceeded 80 percent
              for at least ten minutes.

        # ---------------------------------------------------------------------
        # High Memory
        # ---------------------------------------------------------------------

        - alert: KubernetesNodeHighMemory

          expr: |
            (
              (
                node_memory_MemTotal_bytes -
                node_memory_MemAvailable_bytes
              )
              /
              node_memory_MemTotal_bytes
            ) * 100 > 85

          for: 10m

          labels:
            severity: warning
            service: kubernetes
            category: resources

          annotations:
            summary: High node memory utilization.
            description: >
              Node {{ $labels.instance }}
              memory utilization has exceeded 85 percent
              for at least ten minutes.

        # ---------------------------------------------------------------------
        # Pod CrashLoopBackOff
        # ---------------------------------------------------------------------

        - alert: PodCrashLoopBackOff

          expr: |
            kube_pod_container_status_waiting_reason{
              reason="CrashLoopBackOff"
            } == 1

          for: 5m

          labels:
            severity: critical
            service: kubernetes
            category: pod-health

          annotations:
            summary: Pod is in CrashLoopBackOff.
            description: >
              Pod {{ $labels.namespace }}/{{ $labels.pod }}
              has remained in CrashLoopBackOff for more than five minutes.

        # ---------------------------------------------------------------------
        # Frequent Restarts
        # ---------------------------------------------------------------------

        - alert: PodRestartingFrequently

          expr: |
            increase(
              kube_pod_container_status_restarts_total[15m]
            ) > 5

          for: 5m

          labels:
            severity: warning
            service: kubernetes
            category: pod-health

          annotations:
            summary: Container is restarting frequently.
            description: >
              Container {{ $labels.container }} in pod
              {{ $labels.namespace }}/{{ $labels.pod }}
              restarted more than five times during the last 15 minutes.

        # ---------------------------------------------------------------------
        # Persistent Volume Warning
        # ---------------------------------------------------------------------

        - alert: PersistentVolumeAlmostFull

          expr: |
            (
              kubelet_volume_stats_used_bytes
              /
              kubelet_volume_stats_capacity_bytes
            ) * 100 > 80

          for: 10m

          labels:
            severity: warning
            service: kubernetes
            category: storage

          annotations:
            summary: Persistent volume is nearing capacity.
            description: >
              Persistent volume claim
              {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }}
              has exceeded 80 percent utilization.

        # ---------------------------------------------------------------------
        # Persistent Volume Critical
        # ---------------------------------------------------------------------

        - alert: PersistentVolumeCritical

          expr: |
            (
              kubelet_volume_stats_used_bytes
              /
              kubelet_volume_stats_capacity_bytes
            ) * 100 > 90

          for: 5m

          labels:
            severity: critical
            service: kubernetes
            category: storage

          annotations:
            summary: Persistent volume is almost full.
            description: >
              Persistent volume claim
              {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }}
              has exceeded 90 percent utilization.

        # ---------------------------------------------------------------------
        # Deployment Availability
        # ---------------------------------------------------------------------

        - alert: DeploymentReplicasUnavailable

          expr: |
            kube_deployment_status_replicas_available
            <
            kube_deployment_spec_replicas

          for: 10m

          labels:
            severity: warning
            service: kubernetes
            category: workload-health

          annotations:
            summary: Deployment has unavailable replicas.
            description: >
              Deployment {{ $labels.namespace }}/{{ $labels.deployment }}
              has fewer available replicas than desired.

        # ---------------------------------------------------------------------
        # StatefulSet Availability
        # ---------------------------------------------------------------------

        - alert: StatefulSetReplicasUnavailable

          expr: |
            kube_statefulset_status_replicas_ready
            <
            kube_statefulset_replicas

          for: 10m

          labels:
            severity: warning
            service: kubernetes
            category: workload-health

          annotations:
            summary: StatefulSet has unavailable replicas.
            description: >
              StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }}
              has fewer ready replicas than desired.

        # ---------------------------------------------------------------------
        # DaemonSet Availability
        # ---------------------------------------------------------------------

        - alert: DaemonSetRolloutStuck

          expr: |
            kube_daemonset_status_number_unavailable > 0

          for: 10m

          labels:
            severity: warning
            service: kubernetes
            category: workload-health

          annotations:
            summary: DaemonSet rollout is incomplete.
            description: >
              DaemonSet {{ $labels.namespace }}/{{ $labels.daemonset }}
              has unavailable pods for more than ten minutes.
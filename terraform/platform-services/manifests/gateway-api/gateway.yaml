apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: avos-gateway
  namespace: istio-ingress
spec:
  gatewayClassName: istio
  addresses:
    - type: Hostname
      value: avos-ingress.istio-ingress.svc.cluster.local
  listeners:
    - name: http
      hostname: "*.avos-dev.cloudhusller.com"
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: avos-dev

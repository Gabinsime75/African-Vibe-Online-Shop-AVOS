apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cloudhustler-staging-test
  namespace: cert-manager-test
spec:
  secretName: cloudhustler-staging-test-tls

  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
    group: cert-manager.io

  dnsNames:
    - cert-test.cloudhusller.com
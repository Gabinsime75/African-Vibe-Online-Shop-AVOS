apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: avos-platform-validation
  namespace: avos-dev
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m
  secretStoreRef:
    name: avos-dev-secrets-manager
    kind: SecretStore
  target:
    name: avos-platform-validation
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: message
      remoteRef:
        key: avos/dev/platform-validation
        property: message

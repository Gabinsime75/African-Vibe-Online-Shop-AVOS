fullnameOverride: argocd-image-updater

replicaCount: 1

serviceAccount:
  create: true
  name: argocd-image-updater

extraEnv:
  - name: AWS_REGION
    value: us-east-2
  - name: AWS_DEFAULT_REGION
    value: us-east-2
  - name: AWS_EC2_METADATA_DISABLED
    value: "true"

config:
  registries:
    - name: AVOS ECR
      api_url: https://396913735153.dkr.ecr.us-east-2.amazonaws.com
      prefix: 396913735153.dkr.ecr.us-east-2.amazonaws.com
      credentials: ext:/scripts/ecr-login.sh
      credsexpire: 10h

authScripts:
  enabled: true
  scripts:
    ecr-login.sh: |
      #!/bin/sh
      set -eu
      password="$(aws ecr get-login-password --region us-east-2)"
      printf 'AWS:%s\n' "$password"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

extraArgs:
  - --watch-namespaces=argocd
  - --argocd-namespace=argocd

rbac:
  enabled: false

extraObjects:
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: avos-image-updater
      namespace: argocd
    rules:
      - apiGroups: ["argoproj.io"]
        resources: ["applications"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["argocd-image-updater.argoproj.io"]
        resources: ["imageupdaters"]
        verbs: ["get", "list", "watch", "patch", "update"]
      - apiGroups: ["argocd-image-updater.argoproj.io"]
        resources: ["imageupdaters/status"]
        verbs: ["get", "patch", "update"]
      - apiGroups: ["argocd-image-updater.argoproj.io"]
        resources: ["imageupdaters/finalizers"]
        verbs: ["update"]
      - apiGroups: [""]
        resources: ["secrets"]
        resourceNames: ["avos-image-updater-git"]
        verbs: ["get"]
      - apiGroups: [""]
        resources: ["configmaps"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["coordination.k8s.io"]
        resources: ["leases"]
        verbs: ["get", "create", "update"]
      - apiGroups: [""]
        resources: ["events"]
        verbs: ["create", "patch"]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: avos-image-updater
      namespace: argocd
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: avos-image-updater
    subjects:
      - kind: ServiceAccount
        name: argocd-image-updater
        namespace: argocd

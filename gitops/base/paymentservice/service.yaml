apiVersion: v1
kind: Service

metadata:
  name: paymentservice
  labels:
    app: paymentservice
    app.kubernetes.io/name: paymentservice
    app.kubernetes.io/part-of: cloudhusller-commerce-platform

spec:
  # Internal-only service.
  type: ClusterIP

  selector:
    app: paymentservice

  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
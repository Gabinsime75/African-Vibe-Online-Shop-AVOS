apiVersion: apps/v1
kind: Deployment

metadata:
  name: currencyservice
  labels:
    app: currencyservice
    app.kubernetes.io/name: currencyservice
    app.kubernetes.io/part-of: cloudhusller-commerce-platform

spec:
  replicas: 2

  selector:
    matchLabels:
      app: currencyservice

  template:
    metadata:
      labels:
        app: currencyservice
        app.kubernetes.io/name: currencyservice
        app.kubernetes.io/part-of: cloudhusller-commerce-platform

    spec:
      containers:
        - name: currencyservice

          # Logical image name.
          # The dev overlay replaces this with the real Amazon ECR image.
          image: currencyservice
          imagePullPolicy: IfNotPresent

          ports:
            - name: grpc
              containerPort: 7000
              protocol: TCP

          env:
            # gRPC listening port.
            - name: PORT
              value: "7000"

          # Basic readiness check for the gRPC endpoint.
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # Restart the container if it stops accepting connections.
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # Baseline resources for the dev environment.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi
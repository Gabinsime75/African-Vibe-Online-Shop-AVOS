# ==================================================================================================================
# Automatically scales the frontend Deployment based on average CPU utilization.
#
# The HPA maintains at least two replicas for availability and permits up to ten
# replicas during increased traffic. Scaling behavior is intentionally asymmetric:
# scale-up responds quickly, while scale-down waits five minutes to reduce flapping.
# ==================================================================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: frontend
  labels:
    app: frontend
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: cloudhusller-commerce-platform

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend

  minReplicas: 2
  maxReplicas: 10

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60

    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

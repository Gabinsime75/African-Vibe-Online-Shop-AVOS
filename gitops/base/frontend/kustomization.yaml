# ==================================================================================================================
# Defines which Kubernetes manifests belong to the reusable frontend base. This file keeps the base independent 
# from environment-specific settings such as AWS account IDs, ECR URLs, and image tags.
# ==================================================================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Environment-independent frontend resources.
resources:
  - deployment.yaml
  - service.yaml
  - hpa.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: adservice
  labels:
    app.kubernetes.io/name: adservice
    app.kubernetes.io/part-of: avos
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: adservice
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: avos-dev
          podSelector:
            matchLabels:
              app.kubernetes.io/part-of: avos
      ports:
        - protocol: TCP
          port: 9555
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

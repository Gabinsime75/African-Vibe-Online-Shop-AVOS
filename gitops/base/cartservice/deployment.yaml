apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartservice
  labels:
    app: cartservice
    app.kubernetes.io/name: cartservice
    app.kubernetes.io/part-of: cloudhusller-commerce-platform

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cartservice

  template:
    metadata:
      labels:
        app: cartservice
        app.kubernetes.io/name: cartservice
        app.kubernetes.io/part-of: cloudhusller-commerce-platform

    spec:
      containers:
        - name: cartservice
          image: cartservice
          imagePullPolicy: IfNotPresent

          ports:
            - name: grpc
              containerPort: 7070
              protocol: TCP

          env:
            - name: REDIS_ADDR
              value: redis-cart:6379

          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
apiVersion: apps/v1
kind: Deployment
metadata:
  name: productcatalogservice
  labels:
    app.kubernetes.io/name: productcatalogservice
    app.kubernetes.io/part-of: avos
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: productcatalogservice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: productcatalogservice
        app.kubernetes.io/part-of: avos
    spec:
      serviceAccountName: productcatalogservice
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: productcatalogservice
      containers:
        - name: productcatalogservice
          image: productcatalogservice:fb60a25b895b838e82532b1e484ef93a73e73fad
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 3550
          env:
            - name: PORT
              value: "3550"
            - name: ENABLE_TRACING
              value: "0"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            grpc:
              port: 3550
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            grpc:
              port: 3550
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            grpc:
              port: 3550
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 64Mi

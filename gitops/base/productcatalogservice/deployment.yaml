apiVersion: apps/v1
kind: Deployment

metadata:
  name: productcatalogservice
  labels:
    app: productcatalogservice
    app.kubernetes.io/name: productcatalogservice
    app.kubernetes.io/part-of: cloudhusller-commerce-platform

spec:
  replicas: 2

  selector:
    matchLabels:
      app: productcatalogservice

  template:
    metadata:
      labels:
        app: productcatalogservice
        app.kubernetes.io/name: productcatalogservice
        app.kubernetes.io/part-of: cloudhusller-commerce-platform

    spec:
      containers:
        - name: productcatalogservice

          # Logical image name.
          # The dev overlay replaces this with the actual Amazon ECR image.
          image: productcatalogservice
          imagePullPolicy: IfNotPresent

          ports:
            - name: grpc
              containerPort: 3550
              protocol: TCP

          env:
            # gRPC listening port used by the service.
            - name: PORT
              value: "3550"

          # Basic TCP readiness check for the gRPC endpoint.
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # Restart the container if the gRPC port stops responding.
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # Baseline resource allocation.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi
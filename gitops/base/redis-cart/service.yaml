apiVersion: v1
kind: Service
metadata:
  name: redis-cart
  labels:
    app: redis-cart
    app.kubernetes.io/name: redis-cart
    app.kubernetes.io/part-of: cloudhusller-commerce-platform

spec:
  type: ClusterIP

  selector:
    app: redis-cart

  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
# ==================================================================================================================
# defines the reusable Kubernetes Deployment for checkoutservice. The base keeps the image generic so the dev overlay 
# can inject the real ECR repository and immutable SHA tag.
# ==================================================================================================================
apiVersion: apps/v1
kind: Deployment

metadata:
  name: checkoutservice
  labels:
    app: checkoutservice
    app.kubernetes.io/name: checkoutservice
    app.kubernetes.io/part-of: cloudhusller-commerce-platform

spec:
  replicas: 2

  selector:
    matchLabels:
      app: checkoutservice

  template:
    metadata:
      labels:
        app: checkoutservice
        app.kubernetes.io/name: checkoutservice
        app.kubernetes.io/part-of: cloudhusller-commerce-platform

    spec:
      containers:
        - name: checkoutservice

          # Logical image name.
          # The dev overlay replaces this with the real Amazon ECR image.
          image: checkoutservice
          imagePullPolicy: IfNotPresent

          ports:
            - name: grpc
              containerPort: 5050
              protocol: TCP

          env:
            # Internal Kubernetes service discovery.
            - name: PORT
              value: "5050"

            - name: PRODUCT_CATALOG_SERVICE_ADDR
              value: "productcatalogservice:3550"

            - name: SHIPPING_SERVICE_ADDR
              value: "shippingservice:50051"

            - name: PAYMENT_SERVICE_ADDR
              value: "paymentservice:50051"

            - name: EMAIL_SERVICE_ADDR
              value: "emailservice:5000"

            - name: CURRENCY_SERVICE_ADDR
              value: "currencyservice:7000"

            - name: CART_SERVICE_ADDR
              value: "cartservice:7070"

          # Basic TCP readiness check for the gRPC service.
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # Restart the container if the service stops accepting connections.
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi
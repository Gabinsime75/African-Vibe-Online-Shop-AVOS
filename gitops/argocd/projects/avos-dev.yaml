apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: avos-dev
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: avos
    environment: dev
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  description: AVOS development application delivery
  sourceRepos:
    - https://github.com/Gabinsime75/African-Vibe-Online-Shop-AVOS.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: avos-dev
  clusterResourceWhitelist: []
  clusterResourceBlacklist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: Pod
    - group: ""
      kind: Endpoints
    - group: "apps"
      kind: Deployment
    - group: "apps"
      kind: ReplicaSet
    - group: "batch"
      kind: Job
    - group: "batch"
      kind: CronJob
    - group: "autoscaling"
      kind: HorizontalPodAutoscaler
    - group: "policy"
      kind: PodDisruptionBudget
    - group: "networking.k8s.io"
      kind: NetworkPolicy
    - group: "discovery.k8s.io"
      kind: EndpointSlice
    - group: "external-secrets.io"
      kind: ExternalSecret
    - group: "gateway.networking.k8s.io"
      kind: HTTPRoute
    - group: "gateway.networking.k8s.io"
      kind: GRPCRoute
    - group: "security.istio.io"
      kind: PeerAuthentication
    - group: "security.istio.io"
      kind: AuthorizationPolicy

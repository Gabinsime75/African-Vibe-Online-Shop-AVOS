{
  "apiVersion": "argoproj.io/v1alpha1",
  "kind": "Application",
  "metadata": {
    "name": "avos-dev-loadgenerator",
    "namespace": "argocd",
    "labels": {
      "app.kubernetes.io/part-of": "avos",
      "environment": "dev"
    }
  },
  "spec": {
    "project": "avos-dev",
    "source": {
      "repoURL": "https://github.com/Gabinsime75/African-Vibe-Online-Shop-AVOS.git",
      "targetRevision": "main",
      "path": "gitops/overlays/dev/loadgenerator"
    },
    "destination": {
      "server": "https://kubernetes.default.svc",
      "namespace": "avos-dev"
    },
    "syncPolicy": {
      "syncOptions": [
        "FailOnSharedResource=true"
      ]
    }
  }
}

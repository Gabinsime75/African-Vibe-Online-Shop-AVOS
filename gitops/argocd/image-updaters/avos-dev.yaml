apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  labels:
    app.kubernetes.io/part-of: avos
    environment: dev
  name: avos-dev
  namespace: argocd
spec:
  applicationRefs:
  - images:
    - alias: frontend
      commonUpdateSettings:
        allowTags: regexp:^[0-9a-f]{40}$
        updateStrategy: newest-build
      imageName: 396913735153.dkr.ecr.us-east-2.amazonaws.com/avos/dev/frontend
      manifestTargets:
        kustomize:
          name: frontend
    namePattern: avos-dev-frontend
  - images:
    - alias: adservice
      commonUpdateSettings:
        allowTags: regexp:^[0-9a-f]{40}$
        updateStrategy: newest-build
      imageName: 396913735153.dkr.ecr.us-east-2.amazonaws.com/avos/dev/adservice
      manifestTargets:
        kustomize:
          name: adservice
    namePattern: avos-dev-adservice
  - images:
    - alias: cartservice
      commonUpdateSettings:
        allowTags: regexp:^[0-9a-f]{40}$
        updateStrategy: newest-build
      imageName: 396913735153.dkr.ecr.us-east-2.amazonaws.com/avos/dev/cartservice
      manifestTargets:
        kustomize:
          name: cartservice
    namePattern: avos-dev-cartservice
  - images:
    - alias: checkoutservice
      commonUpdateSettings:
        allowTags: regexp:^[0-9a-f]{40}$
        updateStrategy: newest-build
      imageName: 396913735153.dkr.ecr.us-east-2.amazonaws.com/avos/dev/checkoutservice
      manifestTargets:
        kustomize:
          name: checkoutservice
    namePattern: avos-dev-checkoutservice
  - images:
    - alias: currencyservice
      commonUpdateSettings:
        allowTags: regexp:^[0-9a-f]{40}$
        updateStrategy: newest-build
      imageName: 396913735153.dkr.ecr.us-east-2.amazonaws.com/avos/dev/currencyservice
      manifestTargets:
        kustomize:
          name: currencyservice
    namePattern: avos-dev-currencyservice
  - images:
    - alias: emailservice
      commonUpdateSettings:
        allowTags: regexp:^[0-9a-f]{40}$
        updateStrategy: newest-build
      imageName: 396913735153.dkr.ecr.us-east-2.amazonaws.com/avos/dev/emailservice
      manifestTargets:
        kustomize:
          name: emailservice
    namePattern: avos-dev-emailservice
  - images:
    - alias: paymentservice
      commonUpdateSettings:
        allowTags: regexp:^[0-9a-f]{40}$
        updateStrategy: newest-build
      imageName: 396913735153.dkr.ecr.us-east-2.amazonaws.com/avos/dev/paymentservice
      manifestTargets:
        kustomize:
          name: paymentservice
    namePattern: avos-dev-paymentservice
  - images:
    - alias: productcatalogservice
      commonUpdateSettings:
        allowTags: regexp:^[0-9a-f]{40}$
        updateStrategy: newest-build
      imageName: 396913735153.dkr.ecr.us-east-2.amazonaws.com/avos/dev/productcatalogservice
      manifestTargets:
        kustomize:
          name: productcatalogservice
    namePattern: avos-dev-productcatalogservice
  - images:
    - alias: recommendationservice
      commonUpdateSettings:
        allowTags: regexp:^[0-9a-f]{40}$
        updateStrategy: newest-build
      imageName: 396913735153.dkr.ecr.us-east-2.amazonaws.com/avos/dev/recommendationservice
      manifestTargets:
        kustomize:
          name: recommendationservice
    namePattern: avos-dev-recommendationservice
  - images:
    - alias: shippingservice
      commonUpdateSettings:
        allowTags: regexp:^[0-9a-f]{40}$
        updateStrategy: newest-build
      imageName: 396913735153.dkr.ecr.us-east-2.amazonaws.com/avos/dev/shippingservice
      manifestTargets:
        kustomize:
          name: shippingservice
    namePattern: avos-dev-shippingservice
  - images:
    - alias: loadgenerator
      commonUpdateSettings:
        allowTags: regexp:^[0-9a-f]{40}$
        forceUpdate: true
        updateStrategy: newest-build
      imageName: 396913735153.dkr.ecr.us-east-2.amazonaws.com/avos/dev/loadgenerator
      manifestTargets:
        kustomize:
          name: loadgenerator
    namePattern: avos-dev-loadgenerator
  writeBackConfig:
    gitConfig:
      branch: main:image-updater/dev-{{.SHA256}}
      writeBackTarget: kustomization
    method: git:secret:argocd/avos-image-updater-git

apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: avos-dev
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: avos
    environment: dev
spec:
  writeBackConfig:
    method: git:secret:argocd/avos-image-updater-git
    gitConfig:
      branch: main:image-updater/dev-{{.SHA256}}
      writeBackTarget: kustomization
  applicationRefs:
  - namePattern: avos-dev-frontend
    images:
    - alias: frontend
      imageName: 396913735153.dkr.ecr.us-east-2.amazonaws.com/avos/dev/frontend
      commonUpdateSettings:
        updateStrategy: newest-build
        allowTags: regexp:^[0-9a-f]{40}$
      manifestTargets:
        kustomize:
          name: frontend
  - namePattern: avos-dev-adservice
    images:
    - alias: adservice
      imageName: 396913735153.dkr.ecr.us-east-2.amazonaws.com/avos/dev/adservice
      commonUpdateSettings:
        updateStrategy: newest-build
        allowTags: regexp:^[0-9a-f]{40}$
      manifestTargets:
        kustomize:
          name: adservice
  - namePattern: avos-dev-cartservice
    images:
    - alias: cartservice
      imageName: 396913735153.dkr.ecr.us-east-2.amazonaws.com/avos/dev/cartservice
      commonUpdateSettings:
        updateStrategy: newest-build
        allowTags: regexp:^[0-9a-f]{40}$
      manifestTargets:
        kustomize:
          name: cartservice
  - namePattern: avos-dev-checkoutservice
    images:
    - alias: checkoutservice
      imageName: 396913735153.dkr.ecr.us-east-2.amazonaws.com/avos/dev/checkoutservice
      commonUpdateSettings:
        updateStrategy: newest-build
        allowTags: regexp:^[0-9a-f]{40}$
      manifestTargets:
        kustomize:
          name: checkoutservice
  - namePattern: avos-dev-currencyservice
    images:
    - alias: currencyservice
      imageName: 396913735153.dkr.ecr.us-east-2.amazonaws.com/avos/dev/currencyservice
      commonUpdateSettings:
        updateStrategy: newest-build
        allowTags: regexp:^[0-9a-f]{40}$
      manifestTargets:
        kustomize:
          name: currencyservice
  - namePattern: avos-dev-emailservice
    images:
    - alias: emailservice
      imageName: 396913735153.dkr.ecr.us-east-2.amazonaws.com/avos/dev/emailservice
      commonUpdateSettings:

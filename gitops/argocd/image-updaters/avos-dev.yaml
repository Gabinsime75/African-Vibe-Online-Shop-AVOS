      manifestTargets:
        kustomize:
          name: paymentservice
  - namePattern: avos-dev-productcatalogservice
    images:
    - alias: productcatalogservice
      imageName: 396913735153.dkr.ecr.us-east-2.amazonaws.com/avos/dev/productcatalogservice
      commonUpdateSettings:
        updateStrategy: newest-build
        allowTags: regexp:^[0-9a-f]{40}$
      manifestTargets:
        kustomize:
          name: productcatalogservice
  - namePattern: avos-dev-recommendationservice
    images:
    - alias: recommendationservice
      imageName: 396913735153.dkr.ecr.us-east-2.amazonaws.com/avos/dev/recommendationservice

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Reuse the environment-independent checkoutservice base.
resources:
  - ../../../base/checkoutservice

# Label rendered resources as part of the dev environment.
labels:
  - pairs:
      environment: dev

# Replace the logical image with the immutable ECR image.
images:
  - name: checkoutservice
    newName: 396913735153.dkr.ecr.us-east-2.amazonaws.com/cloudhusller-commerce-platform-dev/checkoutservice
    newTag: cba99ed13039
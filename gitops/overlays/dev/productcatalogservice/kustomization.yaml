apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Reuse the environment-independent productcatalogservice base.
resources:
  - ../../../base/productcatalogservice

# Add the dev environment label to rendered resources.
labels:
  - pairs:
      environment: dev

# Replace the logical image with the immutable ECR image.
images:
  - name: productcatalogservice
    newName: 396913735153.dkr.ecr.us-east-2.amazonaws.com/cloudhusller-commerce-platform-dev/productcatalogservice
    newTag: d72c6b514c8d
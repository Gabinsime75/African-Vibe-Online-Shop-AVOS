apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Reuse the environment-independent shippingservice base.
resources:
  - ../../../base/shippingservice


# Add the dev environment label to rendered resources.
labels:
  - pairs:
      environment: dev

# Replace the logical image with the immutable ECR image.
images:
  - name: shippingservice
    newName: 396913735153.dkr.ecr.us-east-2.amazonaws.com/cloudhusller-commerce-platform-dev/shippingservice
    newTag: 0a292fcb9a2c
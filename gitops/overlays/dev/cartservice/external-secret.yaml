# AVOS cart credentials supplied by Secrets Manager.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cart-redis
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: avos-dev-secrets-manager
    kind: SecretStore
  target:
    name: cart-redis
    creationPolicy: Owner
  data:
    - secretKey: address
      remoteRef:
        key: avos/dev/cart-redis
        property: address
    - secretKey: password
      remoteRef:
        key: avos/dev/cart-redis
        property: password

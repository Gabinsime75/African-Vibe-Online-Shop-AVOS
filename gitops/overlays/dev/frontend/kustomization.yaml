# ====================================================================================================
# Defines the dev-specific configuration for the frontend service. 
# It points Kustomize to the reusable base, adds the dev environment label, and replaces the generic 
# frontend image with the actual Amazon ECR repository and immutable Git SHA tag.
# =====================================================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Reuse the environment-independent frontend base.
resources:
  - ../../../base/frontend

# Add the environment label to all rendered frontend resources.
labels:
  - pairs:
      environment: dev

# Replace the logical image name from the base with the real ECR image.
images:
  - name: frontend

    # Amazon ECR repository created during Phase 8.1.
    newName: 396913735153.dkr.ecr.us-east-2.amazonaws.com/cloudhusller-commerce-platform-dev/frontend

    # Immutable Git SHA tag produced by GitHub Actions.
    # Replace thf280c4396897  is placeholder with an actual image tag from ECR.
    newTag: e7da48086cfd
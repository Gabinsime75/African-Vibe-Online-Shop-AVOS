name: AVOS CI - paymentservice

on:
  pull_request:
    paths:
      - 'src/paymentservice/**'
      - 'protos/**'
      - '.github/scripts/**'
      - '.github/workflows/avos-service-ci.yml'
      - '.github/workflows/avos-ci-paymentservice.yml'
  push:
    branches:
      - main
    paths:
      - 'src/paymentservice/**'
      - 'protos/**'
      - '.github/scripts/**'
      - '.github/workflows/avos-service-ci.yml'
      - '.github/workflows/avos-ci-paymentservice.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avos-ci-paymentservice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service-ci:
    uses: ./.github/workflows/avos-service-ci.yml
    with:
      service-name: paymentservice
      service-path: src/paymentservice
      runtime: node
      ecr-repository: avos/dev/paymentservice

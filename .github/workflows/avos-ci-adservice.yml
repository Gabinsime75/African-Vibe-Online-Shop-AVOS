name: AVOS CI - adservice

on:
  pull_request:
    paths:
      - 'src/adservice/**'
      - 'protos/**'
      - '.github/scripts/**'
      - '.github/policies/image-verification.json'
      - '.github/workflows/avos-service-ci.yml'
      - '.github/workflows/avos-ci-adservice.yml'
  push:
    branches:
      - main
    paths:
      - 'src/adservice/**'
      - 'protos/**'
      - '.github/scripts/**'
      - '.github/policies/image-verification.json'
      - '.github/workflows/avos-service-ci.yml'
      - '.github/workflows/avos-ci-adservice.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avos-ci-adservice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service-ci:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/avos-service-ci.yml
    with:
      service-name: adservice
      service-path: src/adservice
      runtime: java
      ecr-repository: avos/dev/adservice

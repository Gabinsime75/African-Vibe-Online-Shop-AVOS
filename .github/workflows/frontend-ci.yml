name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - "applications/frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - ".github/workflows/reusable-service-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "applications/frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - ".github/workflows/reusable-service-ci.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  frontend:
    uses: ./.github/workflows/reusable-service-ci.yml

    with:
      service_name: frontend
      service_path: applications/frontend
      runtime: go
      aws_region: us-east-2
      ecr_repository: cloudhusller-commerce-platform-dev/frontend
      role_to_assume: arn:aws:iam::396913735153:role/cloudhusller-commerce-platform-dev-github-actions-ci

    secrets: inherit




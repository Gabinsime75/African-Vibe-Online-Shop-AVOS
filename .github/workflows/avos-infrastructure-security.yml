name: AVOS Infrastructure Security

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - 'gitops/**'
      - '.github/scripts/security/**'
      - '.github/workflows/avos-infrastructure-security.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avos-infrastructure-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configuration:
    name: Scan Terraform and GitOps configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Test AVOS security policy
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover \
            -s .github/scripts/security \
            -p "test*.py" \
            -v

      - name: Install verified Trivy
        shell: bash
        run: bash .github/scripts/security/install-trivy.sh

      - name: Scan infrastructure configuration
        id: security
        shell: bash
        run: bash .github/scripts/security/scan-infrastructure.sh

      - name: Upload sanitized infrastructure reports
        if: always() && steps.security.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: avos-security-infrastructure
          path: ${{ runner.temp }}/avos-security/infrastructure/*.json
          if-no-files-found: ignore
          retention-days: 7

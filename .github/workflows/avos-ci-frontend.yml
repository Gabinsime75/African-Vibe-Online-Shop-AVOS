name: AVOS CI - frontend

on:
  pull_request:
    paths:
      - 'src/frontend/**'
      - 'protos/**'
      - '.github/scripts/**'
      - '.github/policies/image-verification.json'
      - '.github/workflows/avos-service-ci.yml'
      - '.github/workflows/avos-ci-frontend.yml'
  push:
    branches:
      - main
    paths:
      - 'src/frontend/**'
      - 'protos/**'
      - '.github/scripts/**'
      - '.github/policies/image-verification.json'
      - '.github/workflows/avos-service-ci.yml'
      - '.github/workflows/avos-ci-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avos-ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service-ci:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/avos-service-ci.yml
    with:
      service-name: frontend
      service-path: src/frontend
      runtime: go
      ecr-repository: avos/dev/frontend

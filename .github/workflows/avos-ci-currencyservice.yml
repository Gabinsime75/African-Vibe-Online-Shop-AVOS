name: AVOS CI - currencyservice

on:
  pull_request:
    paths:
      - 'src/currencyservice/**'
      - 'protos/**'
      - '.github/scripts/**'
      - '.github/workflows/avos-service-ci.yml'
      - '.github/workflows/avos-ci-currencyservice.yml'
  push:
    branches:
      - main
    paths:
      - 'src/currencyservice/**'
      - 'protos/**'
      - '.github/scripts/**'
      - '.github/workflows/avos-service-ci.yml'
      - '.github/workflows/avos-ci-currencyservice.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avos-ci-currencyservice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service-ci:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/avos-service-ci.yml
    with:
      service-name: currencyservice
      service-path: src/currencyservice
      runtime: node
      ecr-repository: avos/dev/currencyservice

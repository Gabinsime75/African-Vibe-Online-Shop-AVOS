name: AVOS CI - recommendationservice

on:
  pull_request:
    paths:
      - 'src/recommendationservice/**'
      - 'protos/**'
      - '.github/scripts/**'
      - '.github/policies/image-verification.json'
      - '.github/workflows/avos-service-ci.yml'
      - '.github/workflows/avos-ci-recommendationservice.yml'
  push:
    branches:
      - main
    paths:
      - 'src/recommendationservice/**'
      - 'protos/**'
      - '.github/scripts/**'
      - '.github/policies/image-verification.json'
      - '.github/workflows/avos-service-ci.yml'
      - '.github/workflows/avos-ci-recommendationservice.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avos-ci-recommendationservice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service-ci:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/avos-service-ci.yml
    with:
      service-name: recommendationservice
      service-path: src/recommendationservice
      runtime: python
      ecr-repository: avos/dev/recommendationservice

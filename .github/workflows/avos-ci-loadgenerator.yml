name: AVOS CI - loadgenerator

on:
  pull_request:
    paths:
      - 'src/loadgenerator/**'
      - 'protos/**'
      - '.github/scripts/**'
      - '.github/workflows/avos-service-ci.yml'
      - '.github/workflows/avos-ci-loadgenerator.yml'
  push:
    branches:
      - main
    paths:
      - 'src/loadgenerator/**'
      - 'protos/**'
      - '.github/scripts/**'
      - '.github/workflows/avos-service-ci.yml'
      - '.github/workflows/avos-ci-loadgenerator.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avos-ci-loadgenerator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service-ci:
    uses: ./.github/workflows/avos-service-ci.yml
    with:
      service-name: loadgenerator
      service-path: src/loadgenerator
      runtime: python
      ecr-repository: avos/dev/loadgenerator

name: Checkout Service CI

on:
  push:
    branches:
      - main
    paths:
      - "applications/checkoutservice/**"
      - ".github/workflows/checkoutservice-ci.yml"
      - ".github/workflows/reusable-service-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "applications/checkoutservice/**"
      - ".github/workflows/checkoutservice-ci.yml"
      - ".github/workflows/reusable-service-ci.yml"

permissions:
  contents: read
  id-token: write

jobs:
  checkoutservice:
    uses: ./.github/workflows/reusable-service-ci.yml

    with:
      service_name: checkoutservice
      service_path: applications/checkoutservice
      runtime: go
      aws_region: us-east-2
      ecr_repository: cloudhusller-commerce-platform-dev/checkoutservice
      role_to_assume: arn:aws:iam::396913735153:role/cloudhusller-commerce-platform-dev-github-actions-ci

    secrets: inherit
name: AVOS CI - checkoutservice

on:
  pull_request:
    paths:
      - 'src/checkoutservice/**'
      - 'protos/**'
      - '.github/scripts/**'
      - '.github/workflows/avos-service-ci.yml'
      - '.github/workflows/avos-ci-checkoutservice.yml'
  push:
    branches:
      - main
    paths:
      - 'src/checkoutservice/**'
      - 'protos/**'
      - '.github/scripts/**'
      - '.github/workflows/avos-service-ci.yml'
      - '.github/workflows/avos-ci-checkoutservice.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avos-ci-checkoutservice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service-ci:
    uses: ./.github/workflows/avos-service-ci.yml
    with:
      service-name: checkoutservice
      service-path: src/checkoutservice
      runtime: go
      ecr-repository: avos/dev/checkoutservice
